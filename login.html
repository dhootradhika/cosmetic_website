<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

/* Background */
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

/* Glassmorphism Box */
.login-box {
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.1);
    padding: 30px;
    width: 320px;
    border-radius: 15px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    color: white;
    text-align: center;
}

/* Inputs */
.input-group {
    position: relative;
    margin: 15px 0;
}

.input-group input {
    width: 100%;
    padding: 12px 40px;
    border-radius: 8px;
    border: none;
    outline: none;
}

.input-group i {
    position: absolute;
    top: 12px;
    color: #333;
}
.top-icons {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 15px;
    font-size: 20px;
    color: white;
}

.top-icons i {
    cursor: pointer;
    transition: 0.3s;
}

.top-icons i:hover {
    color: #ddd;
}

.left-icon { left: 10px; }
.right-icon { right: 10px; cursor: pointer; }

/* Button */
button {
    width: 100%;
    padding: 12px;
    border: none;
    background: #fff;
    color: #333;
    border-radius: 8px;
    cursor: pointer;
}

/* Dark Mode */
.dark {
    background: #121212;
}

.dark .login-box {
    background: rgba(0,0,0,0.5);
    color: white;
}

.toggle-dark {
    position: absolute;
    top: 20px;
    right: 20px;
    cursor: pointer;
    color: white;
}
/* Eye icon (professional) */
.eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#555;
}
</style>
</head>

<body>


<div class="top-icons">
    <!-- Dark Mode -->
    <i class="fas fa-moon" onclick="toggleDark()" title="Dark Mode"></i>

    <!-- Admin -->
    <a href="admin.html" title="Admin Login">
        <i class="fas fa-user-shield"></i>
    </a>
</div>
<div class="login-box">
    <h2>Login</h2>

    <form action="backend\login.php" method="POST">

    <div class="input-group">
        <i class="fas fa-envelope left-icon"></i>
        <input type="email" name="email" placeholder="Email" required>
    </div>

    <div class="input-group">
        <i class="fas fa-lock left-icon"></i>
        <input type="password" id="password" name="password" placeholder="Password" required>
        <i class="fas fa-eye right-icon" onclick="togglePassword()" id="eye"></i>
    </div>

    <p style="text-align:right; font-size:14px;">
        <a href="#" onclick="forgotPassword()">Forgot Password?</a>
    </p>

    <!-- ✅ FIXED BUTTON -->
    <button type="submit">Login</button>

    <p style="margin-top:10px; font-size:14px;">
        New user? <a href="#" onclick="showSignup()">Sign Up</a>
    </p>

    </form>
</div>

<!-- SIGNUP BOX -->
<div class="login-box" id="signupBox" style="display:none;">
    <h2>Sign Up</h2>

    <form onsubmit="return signupUser()">
        <div class="input-group">
        <input type="text" id="name" placeholder="Full Name" required>
        </div>
        <div class="input-group">
        <input type="tel" id="phone" placeholder="Phone Number" 
            pattern="[0-9]{10}" maxlength="10" required>
        </div>

        <div class="input-group">
            <input type="email" id="newEmail" placeholder="Enter Email" required>
        </div>

        <div class="input-group">
            <input type="password" id="newPassword" placeholder="Create Password" required>
            <i class="fa-solid fa-eye eye" onclick="togglePass('password',this)"></i>
        </div>
        <div class="input-group">
        <input type="password" id="confirm" placeholder="Confirm Password" required>
        <i class="fa-solid fa-eye eye" onclick="togglePass('confirm',this)"></i>
        </div>


        <button type="submit">Create Account</button>

        <p style="margin-top:10px;">
            Already have an account? 
            <a href="login.html" onclick="showLogin()">Login</a>
        </p>
    </form>
</div>

<script>
// 🌙 DARK MODE
function toggleDark() {
    document.body.classList.toggle("dark");
}

// 👁 LOGIN PASSWORD
function togglePassword() {
    let pass = document.getElementById("password");
    let icon = document.getElementById("eye");

    if (pass.type === "password") {
        pass.type = "text";
        icon.classList.replace("fa-eye","fa-eye-slash");
    } else {
        pass.type = "password";
        icon.classList.replace("fa-eye-slash","fa-eye");
    }
}

// 👁 SIGNUP PASSWORD
function togglePass(id,icon){
    let field = document.getElementById(id);

    if(field.type === "password"){
        field.type = "text";
        icon.classList.replace("fa-eye","fa-eye-slash");
    }else{
        field.type = "password";
        icon.classList.replace("fa-eye-slash","fa-eye");
    }
}

// 🔐 LOGIN (FIXED)
function loginUser() {
    let email = document.getElementById("email").value;
    let pass = document.getElementById("password").value;

    // ✅ ADMIN LOGIN FIRST
    if(email === "admin@gmail.com" && pass === "Admin@123"){
        alert("Admin Login");
        window.location.href = "admin.html";
        return false;
    }

    let users = JSON.parse(localStorage.getItem("users")) || [];

    let user = users.find(u => u.email === email && u.password === pass);

    if(user){
        alert("Login Successful!");
        window.location.href = "login.html";
    } else {
        alert("Invalid email or password");
    }

    return false;
}

// 🆕 SIGNUP (FIXED)
function signupUser(){
    let name = document.getElementById("name").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let email = document.getElementById("newEmail").value.trim();
    let pass = document.getElementById("newPassword").value;
    let confirm = document.getElementById("confirm").value;

    if(!name || !phone || !email || !pass || !confirm){
        alert("All fields are required");
        return false;
    }

    if(pass !== confirm){
        alert("Passwords do not match");
        return false;
    }

    fetch("signup.php", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: `name=${name}&phone=${phone}&email=${email}&password=${pass}`
    })
    .then(res => res.text())
    .then(data => {
        alert(data);
    });

    return false;
}

// 🔄 SWITCH FORMS
function showSignup(){
    document.querySelector(".login-box").style.display = "none";
    document.getElementById("signupBox").style.display = "block";
}

function showLogin(){
    document.querySelector(".login-box").style.display = "block";
    document.getElementById("signupBox").style.display = "none";
}

// 🔑 FORGOT PASSWORD (FIXED)
function forgotPassword(){
    let email = prompt("Enter your registered email:");
    if(!email) return;

    let newPass = prompt("Enter new password:");
    if(!newPass) return;

    fetch("backend/forgot_password.php", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(newPass)}`
    })
    .then(res => res.text())
    .then(data => alert(data));
}

</script>
</body>
</html>
